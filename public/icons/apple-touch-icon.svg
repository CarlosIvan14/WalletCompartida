<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bgGradient)"/>
  <!-- Chick body -->
  <circle cx="90" cy="105" r="45" fill="#FCD34D"/>
  <!-- Chick head -->
  <circle cx="90" cy="65" r="35" fill="#FCD34D"/>
  <!-- Eyes -->
  <circle cx="78" cy="58" r="6" fill="#1E293B"/>
  <circle cx="102" cy="58" r="6" fill="#1E293B"/>
  <!-- Eye highlights -->
  <circle cx="76" cy="56" r="2" fill="white"/>
  <circle cx="100" cy="56" r="2" fill="white"/>
  <!-- Beak -->
  <ellipse cx="90" cy="72" rx="6" ry="4" fill="#FB923C"/>
  <!-- Egg shell cracks at bottom -->
  <path d="M40 135 Q55 130 70 135 Q85 140 100 135 Q115 130 130 135 Q145 140 160 135" stroke="#EAB308" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Piggy bank slot -->
  <rect x="83" y="42" width="14" height="2" rx="1" fill="#1E293B" opacity="0.3"/>
</svg>