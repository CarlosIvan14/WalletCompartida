<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - Wallet Cucú</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center p-4 transition-colors duration-500">
  <div class="text-center max-w-sm">
    <div class="mb-6">
      <iconify-icon icon="ph:bird-duotone" class="text-8xl text-indigo-200 animate-float"></iconify-icon>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-3">¡Oh no, sin conexión!</h1>
    <p class="text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
      Parece que el Cucú se ha quedado sin señal. No te preocupes, tus datos locales están a salvo.
    </p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/20 transition-all">
      <iconify-icon icon="lucide:refresh-cw" class="text-lg"></iconify-icon>
      Reintentar conexión
    </a>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('online', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
